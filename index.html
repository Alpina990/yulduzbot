<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_BRAND_NAME% — Telegram Premium, Stars & Gifts</title>
    <meta name="description" content="%VITE_BRAND_NAME%: Telegram Premium, Yulduzlar (Stars) va sovg'alarni o'zbek so'mida xarid qiling. To'lov Click, Payme, Uzum, Uzcard va Humo orqali." />
    <meta name="theme-color" content="#EAF4FB" />
    <link rel="preload" href="/fonts/SF-Pro-Display-Bold-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SF-Pro-Display-Semibold-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    // The pixel script loads after the page; fbq calls queue until then.
    var go=function(){s.parentNode.insertBefore(t,s)};
    if(b.readyState==='complete')go();else f.addEventListener('load',go,{once:true})}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    const pixelIds = %META_PIXEL_IDS%;
    pixelIds.forEach(function(id) { fbq('init', id); });
    if (pixelIds.length) fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
    <!-- Buzzi Stats: one build serves yulduzpay.uz and starpay.uz, so the site id is picked by hostname. -->
    <script>
    (function () {
      var ids = { "yulduzpay.uz": "bf258784-eb06-4282-b463-bb3c29cb53cc", "starpay.uz": "f8182947-4460-443a-b19d-f09111e3260b" };
      var id = ids[location.hostname.replace(/^www\./, "")];
      if (!id) return;
      var s = document.createElement("script");
      s.src = "https://stats.buzzi.uz/script.js";
      s.setAttribute("data-website-id", id);
      s.setAttribute("data-performance", "true");
      s.setAttribute("data-exclude-hash", "true");
      document.head.appendChild(s);
      var c = document.createElement("script");
      c.src = "https://stats.buzzi.uz/clicks.js";
      document.head.appendChild(c);
    })();
    </script>
  </head>
  <body>
    <noscript>%META_PIXEL_NOSCRIPT%</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
